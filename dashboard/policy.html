<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrustLayer - Policy</title>
<style>
  :root{--bg:#0a0b10;--panel:#12141c;--panel2:#171a25;--line:#232838;--text:#e8eaf2;--dim:#9aa3b8;--faint:#707a90;--green:#14f195;--violet:#9945ff;--red:#ff5c5c;--mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace}
  *{margin:0;padding:0;box-sizing:border-box}
  ::selection{background:#9945ff55;color:#fff}
  :focus-visible{outline:2px solid var(--violet);outline-offset:2px;border-radius:4px}
  html{scrollbar-color:#2a3145 var(--bg)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#2a3145;border-radius:6px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-track{background:var(--bg)}
  a{text-underline-offset:3px}
  input,select,textarea{caret-color:var(--green)}
  body{background:var(--bg);color:var(--text);font:16px/1.55 -apple-system,"Segoe UI",Inter,Roboto,sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:0 32px}
  header{border-bottom:1px solid var(--line);padding:20px 0}
  .brand{display:flex;align-items:center;gap:12px;font-weight:650;font-size:18px}
  .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--violet),var(--green));display:grid;place-items:center;font-size:15px;color:#0a0b10;font-weight:800}
  header .wrap{display:flex;justify-content:space-between;align-items:center}
  a.back{color:var(--dim);text-decoration:none;font-size:14px} a.back:hover{color:var(--text)}
  section{padding:40px 0}
  h1{font-size:30px;letter-spacing:-.02em}
  .sub{color:var(--dim);margin:8px 0 26px;font-size:15px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px}
  label{display:block;font-size:13px;color:var(--dim);margin:14px 0 6px}
  input,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:11px 13px;font:14px var(--mono);outline:none}
  input:focus,textarea:focus{border-color:var(--violet)}
  textarea{min-height:90px;resize:vertical}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  button{margin-top:22px;width:100%;padding:13px;border:none;border-radius:10px;background:linear-gradient(90deg,var(--green),#0ecb81);color:#06130c;font-weight:700;font-size:15px;cursor:pointer}
  button:active{transform:scale(.985)}
  .msg{margin-top:16px;border-radius:10px;padding:14px;font-size:14px;display:none}
  .msg.ok{display:block;background:#0d2418;border:1px solid #14f19555;color:var(--green)}
  .msg.err{display:block;background:#2a1215;border:1px solid #ff5c5c55;color:var(--red)}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="brand"><span class="mark">T</span>TrustLayer</div>
  <a class="back" href="./index.html">&larr; Dashboard</a>
</div></header>
<div class="wrap">
<section>
  <h1>Agent policy</h1>
  <p class="sub">What the agent is allowed to do. The gatekeeper signs only transactions that pass these rules.</p>
  <div class="card">
    <div class="row">
      <div><label>Max SOL per transaction</label><input id="maxTx" type="number" step="0.01" min="0"></div>
      <div><label>Total budget (SOL)</label><input id="maxTotal" type="number" step="0.01" min="0"></div>
    </div>
    <label>Allowed destinations (one address per line)</label><textarea id="allow"></textarea>
    <label>Blocked destinations</label><textarea id="block"></textarea>
    <label>Permitted actions (comma separated)</label><input id="actions" value="transfer">
    <div class="row">
      <div><label>Valid for (hours)</label><input id="hours" type="number" min="1" value="2"></div>
      <div><label>API key (required to save; local demo only, never stored)</label><input id="key" type="password" autocomplete="off" placeholder="x-trustlayer-key"></div>
    </div>
    <button id="save">Save policy</button>
    <div class="msg" id="msg"></div>
  </div>
</section>
</div>
<script>
const API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? '' : 'https://trustlayer-api-cf.adzeo2.workers.dev';

const $ = s => document.querySelector(s);
const FALLBACK = {"version":1,"name":"default-hackathon-policy","maxSolPerTransaction":0.05,"maxSolPerDay":0.1,"maxSolTotal":0.1,"allowedActions":["transfer"],"allowedPrograms":["11111111111111111111111111111111"],"allowedDestinations":["HnJmp1w4iSgoHiKjDckNSc9qkXSuREu9Ch2NWJabPC3Z"],"blockedDestinations":["7GC8LGCn9vJ6jDQ1jQQ8ctyyRRcnSRWW2HvVDEsnKScM"]};
function show(p){ $('#maxTx').value=p.maxSolPerTransaction; $('#maxTotal').value=p.maxSolTotal ?? p.maxSolPerDay;
  $('#allow').value=(p.allowedDestinations||[]).join('\n'); $('#block').value=(p.blockedDestinations||[]).join('\n');
  $('#actions').value=(p.allowedActions||['transfer']).join(', '); }
(async()=>{ let p=FALLBACK; try{ p=await(await fetch(API_BASE+'/api/policies')).json(); }catch(e){ $('#msg').className='msg err'; $('#msg').textContent='Live backend unreachable - fields show the repo default policy for reference only (not live state).'; } show(p); })();
$('#save').addEventListener('click', async()=>{
  const p = { version:1, name:'default-hackathon-policy',
    maxSolPerTransaction: parseFloat($('#maxTx').value), maxSolTotal: parseFloat($('#maxTotal').value), maxSolPerDay: parseFloat($('#maxTotal').value),
    allowedActions: $('#actions').value.split(',').map(s=>s.trim()).filter(Boolean),
    allowedPrograms: ['11111111111111111111111111111111'],
    allowedDestinations: $('#allow').value.split('\n').map(s=>s.trim()).filter(Boolean),
    blockedDestinations: $('#block').value.split('\n').map(s=>s.trim()).filter(Boolean),
    expiresAt: new Date(Date.now() + parseFloat($('#hours').value||2)*3600*1000).toISOString() };
  try{
    const r = await fetch(API_BASE+'/api/policies',{method:'PUT',headers:{'content-type':'application/json','x-trustlayer-key':$('#key').value},body:JSON.stringify(p)});
    if(r.status===401){ $('#msg').className='msg err'; $('#msg').textContent='Save rejected (401): wrong or missing API key.'; return; }
    if(r.status===503){ $('#msg').className='msg err'; $('#msg').textContent='Policy updates are disabled on the hosted demo backend - the policy is fixed at deployment time.'; return; }
    if(!r.ok) throw new Error('api '+r.status);
    $('#msg').className='msg ok'; $('#msg').textContent='Policy saved. New evaluations use it immediately; it expires '+new Date(p.expiresAt).toLocaleString()+'.';
  }catch(e){ $('#msg').className='msg err'; $('#msg').textContent='Save failed - the live backend could not be reached.'; }
});
</script>
</body>
</html>
